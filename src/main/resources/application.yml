server:
  port: 8081

spring:
  application:
    name: cclg.dianping

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  jackson:
    default-property-inclusion: non_null

  redis:
    password: 123456
    host: 127.0.0.1
    port: 6379
    timeout: 3000
    database: 0

mybatis-plus:
  type-aliases-package: com.cclg.dianping.domain

logging:
  level:
    com.cclg.dianping: debug
